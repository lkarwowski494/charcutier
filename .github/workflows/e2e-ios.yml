name: E2E Maestro iOS Simulator

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - '.maestro/**'
      - 'ios/**'
      - '.github/workflows/e2e-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=3072
  FORCE_COLOR: '1'
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '480000'
  MAESTRO_CLI_NO_ANALYTICS: '1'
  APP_SCHEME: 'Charcutier'
  APP_DIR: 'Charcutier'
  BUNDLE_ID: 'com.apps4brew.charcutier'

jobs:
  e2e:
    name: Maestro E2E on iOS Simulator
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode 26
        run: bash .github/scripts/select-xcode.sh 26

      - name: Install Dependencies
        run: npm ci

      - name: Prebuild iOS native project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Cache iOS Simulator Build
        id: sim-cache
        uses: actions/cache@v4
        with:
          path: /tmp/Charcutier.app
          key: sim-app-${{ runner.os }}-xcode26-${{ hashFiles('package-lock.json', 'app.json') }}

      - name: Build for iOS Simulator (if cache miss)
        if: steps.sim-cache.outputs.cache-hit != 'true'
        run: |
          xcodebuild build \
            -workspace ios/Charcutier.xcworkspace \
            -scheme Charcutier \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath /tmp/DerivedData
          cp -R /tmp/DerivedData/Build/Products/Debug-iphonesimulator/Charcutier.app /tmp/Charcutier.app

      - name: Boot Simulator & Install App
        run: |
          # Perl process group guard runner
          guard() {
            local timeout_sec="$1"
            local desc="$2"
            shift 2
            perl -e '
              my ($timeout, $desc, @cmd) = @ARGV;
              my $pid = fork();
              if ($pid == 0) {
                setpgrp(0, 0);
                exec(@cmd) or die "exec failed: $!";
              }
              my $start = time();
              while (1) {
                my $kid = waitpid($pid, 1);
                if ($kid == $pid) { exit($? >> 8); }
                if (time() - $start > $timeout) {
                  print STDERR "::error::Timeout ($timeout s) exceeded in: $desc\n";
                  kill("TERM", -$pid);
                  sleep 2;
                  kill("KILL", -$pid);
                  exit 124;
                }
                sleep 1;
              }
            ' "$timeout_sec" "$desc" "$@"
          }

          xcrun simctl bootstatus "iPhone 16" -b || xcrun simctl boot "iPhone 16"
          xcrun simctl install booted /tmp/Charcutier.app

      - name: Run Maestro Flows
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro test .maestro/config.yaml

      - name: Diagnostic Base64 Screenshot on Failure
        if: failure()
        run: |
          xcrun simctl io booted screenshot /tmp/fail-screen.png || true
          if [ -f /tmp/fail-screen.png ]; then
            sips -Z 480 -s format jpeg -s formatOptions 35 /tmp/fail-screen.png --out /tmp/fail-screen.jpg || true
            echo "=== SCREENSHOT_BASE64_START ==="
            base64 < /tmp/fail-screen.jpg
            echo "=== SCREENSHOT_BASE64_END ==="
          fi
