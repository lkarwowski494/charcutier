# Sprawdzenie kompilacji natywnej (bez podpisu) na darmowej maszynie macOS w GitHub Actions
# Weryfikuje poprawność generowania projektu natywnego, Podfile i kompilacji binarki Charcutier
name: iOS — kompilacja
on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-unsigned.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.x
        run: bash scripts/ci/select-xcode.sh 16
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Checks (TypeScript i testy logiki)
        run: npm run verify
      - name: Generate native iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Install pods
        run: cd ios && pod install
      - name: Platforma iOS zgodna z SDK wybranego Xcode
        run: bash scripts/ci/ensure-ios-platform.sh
      - name: Build (no code signing)
        run: |
          set -o pipefail
          WORKSPACE_PATH=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          WORKSPACE_NAME=$(basename "$WORKSPACE_PATH")
          SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          echo "Znaleziono workspace: $WORKSPACE_NAME, scheme: $SCHEME_NAME"
          cd ios
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$SCHEME_NAME/Info.plist" || true
          xcodebuild -workspace "$WORKSPACE_NAME" -scheme "$SCHEME_NAME" -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            2>&1 | tee xcodebuild.log
          APP="build/Build/Products/Release-iphoneos/$SCHEME_NAME.app"
          test -d "$APP" && test -f "$APP/main.jsbundle"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          retention-days: 1
          path: ios/xcodebuild.log
